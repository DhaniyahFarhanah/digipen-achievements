<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The page is already dark: stop phone browsers (Samsung Internet, Chrome auto-dark, Dark Reader) from re-darkening it -->
<meta name="color-scheme" content="dark only">
<meta name="darkreader-lock">
<meta name="theme-color" content="#1f0508">
<title>DigiPen Achievements</title>
<meta name="description" content="Pick your DigiPen Class of 2026 achievements and share them to your story.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Nunito+Sans:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: Steam overlay on a red field. Live story preview (left, sticky) + Steam-style achievement list (right); stacks on phones. */
:root{
  --red-hi:#c71b27; --red-mid:#6d0b13; --red-lo:#1f0508;
  --panel:#15181e; --row:#23262e; --row-hover:#2b2f39; --line:rgba(255,255,255,.08);
  --text:#e6e9ee; --muted:#9aa3ad; --dim:#6f7783;
  --blue:#1a9fff; --blue-2:#47c2ff; --gold:#f4b73a;
  --f-display:"Chakra Petch","Arial Narrow",sans-serif;
  --f-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark only;
}
html{background:var(--red-lo)}
body{
  background:var(--red-lo) radial-gradient(ellipse 90% 60% at 50% -5%,var(--red-hi),var(--red-mid) 55%,var(--red-lo) 100%) no-repeat;
  background-attachment:fixed;
  color:var(--text); font-family:var(--f-body); font-size:15px; line-height:1.45;
  min-height:100%;
}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:24px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#ffb3b8;opacity:.85}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.5vw,42px);line-height:1.05;margin:6px 0 0;text-wrap:balance;letter-spacing:.01em}
.name{display:flex;flex-direction:column;gap:6px;min-width:0}
.name label{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.name input{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);color:var(--text);font:600 16px var(--f-body);padding:10px 12px;border-radius:6px;width:min(260px,100%)}
.name input:focus{outline:2px solid var(--blue);outline-offset:1px}

.grid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}

.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px;align-items:center}
@media (max-width:820px){.preview{position:static}}
.preview canvas{width:100%;max-width:380px;aspect-ratio:9/16;height:auto;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);background:#2a0609}
.btn{appearance:none;border:0;cursor:pointer;font:800 15px var(--f-body);letter-spacing:.02em;border-radius:6px;padding:12px 18px;color:#fff;
  background:linear-gradient(180deg,var(--blue-2),var(--blue));box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.preview .btn{width:100%;max-width:380px}
.hint{font-size:13px;color:#f3c9cc;text-align:center;max-width:380px}

.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border-radius:10px;box-shadow:0 0 0 1px var(--line);overflow:hidden;min-width:0}
.progress{margin:16px;padding:14px 16px;background:rgba(255,255,255,.04);border-radius:6px}
.progress .row{display:flex;justify-content:space-between;gap:12px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.bar{height:8px;margin-top:10px;background:#3a3f4a;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue-2),var(--blue));border-radius:4px;transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:0 16px 12px}
.tabs{display:flex;gap:4px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:800 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:#3a3f4a;color:#fff}
.tab:focus-visible{outline:2px solid var(--blue)}

.list{display:flex;flex-direction:column;gap:6px;padding:0 16px 16px}
.ach{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--row);border-radius:4px;padding:10px 12px;cursor:pointer;transition:background .15s}
.ach:hover{background:var(--row-hover)}
.ach:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.ach .ic{width:64px;height:64px;position:relative}
.ach.featured{background:linear-gradient(100deg,#3a2a14,var(--row) 45%);box-shadow:inset 0 0 0 1px rgba(244,183,58,.55);position:relative;overflow:hidden}
.ach.featured::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,230,160,.18) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.2s ease-in-out infinite}
.ach.featured .ic::before,.ach.featured .ic::after{content:"";position:absolute;width:14px;height:14px;background:#fff7d6;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 4px #ffc24a);animation:twinkle 1.6s ease-in-out infinite}
.ach.featured .ic::before{top:-4px;right:-4px}
.ach.featured .ic::after{bottom:-2px;left:-4px;width:10px;height:10px;animation-delay:.8s}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.4}50%{transform:scale(1);opacity:1}}
.ach .ic svg{width:100%;height:100%;display:block}
.ach h3{margin:0;font-size:17px;font-weight:800;color:#fff;line-height:1.2}
.ach p{margin:2px 0 0;font-size:13.5px;color:#c3c8d0}
.ach .pct{font-size:12.5px;color:var(--dim)}
.ach.locked h3{color:#b5bac2}
.ach.locked p{color:#8c939d}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.state{font-size:12.5px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.ach.on .state{color:#9fd8ff}
.feat{appearance:none;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--muted);font:700 12px var(--f-body);padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.feat:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.feat[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2a1700}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:480px){.ach{grid-template-columns:52px minmax(0,1fr);}.ach .ic{width:52px;height:52px}.side{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between}}

.modal{position:fixed;inset:0;z-index:20;background:rgba(5,6,9,.82);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.btn.sec{background:#3a3f4a}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:14px 16px 0}
.slot{background:#23262e;border-radius:6px;padding:8px;min-height:62px;display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.2;color:var(--dim);min-width:0}
.slot b{font:700 14px var(--f-display);color:var(--muted)}
.slot span{overflow-wrap:anywhere}
.slot.on{box-shadow:inset 0 0 0 1px var(--blue);color:#fff}
.slot.on b{color:var(--blue-2)}
.ordnote{margin:0;padding:10px 16px 0;font-size:13px;color:var(--muted);text-align:left!important}
.ach.dim{opacity:.4}
.pickfoot{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.btn.alt{background:linear-gradient(180deg,#ffd77a,var(--gold));color:#2a1700}
.ord{display:inline-block;min-width:26px;text-align:center;background:#1a9fff;color:#fff;font-weight:800;border-radius:999px;padding:1px 7px;margin-right:4px}
.fchip{background:var(--gold);color:#2a1700;font:800 12px var(--f-body);padding:4px 10px;border-radius:999px;white-space:nowrap}
.pickbox{max-width:560px;align-items:stretch;padding:0;overflow:hidden}
.pickhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pickhead h2{margin:0;font:700 18px var(--f-display);letter-spacing:.02em}
.modal .box.pickbox{align-items:stretch;gap:0}
.picklist{overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.pickbox .ach{grid-template-columns:56px minmax(0,1fr) auto;flex-shrink:0}
.pickbox .ach p{text-align:left}
.pickbox .ach .ic{width:56px;height:56px}
.modal .box{background:var(--panel);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;max-height:100%;max-width:420px;width:100%;box-shadow:0 0 0 1px var(--line)}
.modal img{max-height:62vh;width:auto;max-width:100%;border-radius:8px}
.modal p{margin:0;font-size:14px;color:#c3c8d0;text-align:center}
.ghost{appearance:none;background:#2b2f39;border:0;color:#fff;font:700 14px var(--f-body);padding:10px 16px;border-radius:6px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Trial build · placeholder achievements</div>
      <h1>DigiPen Achievements</h1>
    </div>
  </header>

  <div class="grid">
    <section class="preview" aria-label="Story preview">
      <canvas id="story" width="1080" height="1920" aria-label="Instagram story preview of your achievements"></canvas>
      <button class="btn alt" id="featBtn" type="button">★ Choose featured</button>
      <button class="btn sec" id="ordBtn" type="button">Choose your top 5</button>
      <button class="btn" id="saveBtn" type="button">Download image</button>
      <div class="hint">Tap achievements to unlock them. Then pick your featured one and your top 5 for the story.</div>
    </section>

    <section class="panel" aria-label="Achievements">
      <div class="progress">
        <div class="row"><span id="progText">0 of 0 achievements earned</span><span id="progPct">(0%)</span></div>
        <div class="bar"><i id="progBar" style="width:0"></i></div>
      </div>
      <div class="tools">
        <div class="tabs" role="group" aria-label="Filter">
          <button class="tab" data-f="all" aria-pressed="true">All</button>
          <button class="tab" data-f="on" aria-pressed="false">Unlocked</button>
          <button class="tab" data-f="off" aria-pressed="false">Locked</button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </section>
  </div>
</div>


<div class="modal" id="pick" hidden>
  <div class="box pickbox" role="dialog" aria-labelledby="pickTitle">
    <div class="pickhead"><h2 id="pickTitle">Choose your featured achievement</h2><button class="ghost" id="closePick" type="button">Close</button></div>
    <div class="picklist" id="pickList"></div>
  </div>
</div>

<div class="modal" id="order" hidden>
  <div class="box pickbox" role="dialog" aria-labelledby="ordTitle">
    <div class="pickhead"><h2 id="ordTitle">Choose your top 5</h2><button class="ghost" id="closeOrd" type="button">Close</button></div>
    <div class="slots" id="ordSlots"></div>
    <p class="ordnote" id="ordNote"></p>
    <div class="picklist" id="ordList"></div>
    <div class="pickfoot"><button class="ghost" id="clearOrd" type="button">Clear all</button><button class="btn" id="doneOrd" type="button">Done</button></div>
  </div>
</div>

<script>

/* ---------- state ---------- */
const KEY='grad-ach-v3';

const $=s=>document.querySelector(s);

}

    </div>`;

}

  if(state.earned.has(id)){state.earned.delete(id);if(state.featured===id)state.featured=null;state.order=state.order.filter(x=>x!==id)}

/* ---------- story canvas ---------- */
const cv=$('#story'),ctx=cv.getContext('2d'),W=1080,H=1920;

// make sure the story image uses the real fonts, not a fallback (the canvas can draw before they finish downloading)

const fontsReady=(document.fonts&&document.fonts.load)
  ?Promise.all(FONT_FACES.map(f=>document.fonts.load(f).catch(()=>null))).catch(()=>null)

let tok=0;
async function drawStory(){

    [[ix+246,iy+22,24],[ix+18,iy+226,17],[ix+250,iy+214,12],[ix+36,iy+8,11],
     [x0+cw-52,y+46,15],[x0+cw-96,y+hFeat-40,9],[x0+cw-28,y+hFeat-26,6]].forEach(([sx,sy,r])=>sparkle(sx,sy,r));
    const tx=x0+300,tw=cw-300-28;
    let ty=y+(hFeat-fHC)/2+76;
    font(800,46);ctx.fillStyle='#fff';ctx.textAlign='left';
    fT.forEach((l,i)=>ctx.fillText(l,tx,ty+i*52));ty+=(fT.length-1)*52+48;
    font(600,30);ctx.fillStyle='#c3c8d0';
    fD.forEach((l,i)=>ctx.fillText(l,tx,ty+i*40));ty+=(fD.length-1)*40+46;
    font(600,26);ctx.fillStyle='#7e8794';
    ctx.fillText(`${feat.pct}% of graduates have this achievement`,tx,ty);
    ctx.fillText('Unlocked Oct 14, 2026',tx,ty+36);
    y+=hFeat+28;
  }

  // list rows: icon, title + rarity, flavor text
  for(const r of shown){
    rr(x0,y,cw,r.h,8);ctx.fillStyle='#23262e';ctx.fill();
    const im=imgs.get(r.a.id); if(im)ctx.drawImage(im,x0+20,y+(r.h-ICON)/2,ICON,ICON);
    font(600,24);const pctTxt=r.a.pct+'%';const pw2=ctx.measureText(pctTxt).width;
    ctx.fillStyle='#7e8794';ctx.textAlign='right';ctx.fillText(pctTxt,x0+cw-24,y+52);
    font(800,34);ctx.fillStyle='#fff';ctx.textAlign='left';
    r.tl.forEach((l,i)=>ctx.fillText(l,RX,y+52+i*40));
    font(600,27);ctx.fillStyle='#c3c8d0';
    r.lines.forEach((l,i)=>ctx.fillText(l,RX,y+52+(r.tl.length-1)*40+34+i*34));
    y+=r.h+RGAP;
  }
  if(rOver){
    rr(x0,y,cw,MORE_H,8);ctx.fillStyle='#1d2027';ctx.fill();
    font(800,28);ctx.fillStyle='#c3c8d0';ctx.textAlign='center';
    ctx.fillText(`+${rOver} more achievement${rOver>1?'s':''} unlocked`,x0+cw/2,y+46);
    y+=MORE_H+RGAP;
  }

  // locked
  if(locked.length){
    y+=8;
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(x0,y,cw,2);
    y+=2+52;
    font(600,26,'d');spacing(4);ctx.fillStyle='#9aa3ad';ctx.textAlign='left';ctx.fillText('LOCKED ACHIEVEMENTS',x0,y);spacing(0);
    y+=26;
    const L=116,gap=(cw-L*6)/5;
    lockShow.forEach((a,i)=>{const im=imgs.get(a.id+'L');if(im){ctx.save();ctx.globalAlpha=.85;ctx.drawImage(im,x0+i*(L+gap),y,L,L);ctx.restore()}});
    if(lOver){const lx=x0+lockShow.length*(L+gap);rr(lx+6,y+6,L-12,L-12,10);ctx.fillStyle='#2b2f39';ctx.fill();
      font(800,40);ctx.fillStyle='#c3c8d0';ctx.textAlign='center';ctx.fillText('+'+lOver,lx+L/2,y+L/2+14)}
  }
}

/* ---------- featured picker ---------- */
const pick=$('#pick'),pickList=$('#pickList');
function openPick(){
  const feat=featuredAch();
  const earned=earnedInOrder();
  pickList.innerHTML=earned.length?earned.map(a=>{const isF=feat&&feat.id===a.id;
    return `<div class="ach on${isF?' featured':''}" role="button" tabindex="0" data-pick="${a.id}">
      <div class="ic">${iconSVG(a,false,isF)}</div>
      <div style="min-width:0"><h3>${a.t}</h3><p>${a.d}</p></div>
      <div class="side">${isF?'<span class="fchip">★ Featured</span>':''}</div></div>`}).join('')
    :`<div class="empty">Unlock an achievement first, then you can feature it.</div>`;
  pick.hidden=false;(pickList.querySelector('[data-pick]')||$('#closePick')).focus();
}
function choose(id){state.featured=id;state.order=state.order.filter(x=>x!==id);pick.hidden=true;update();$('#featBtn').focus()}
$('#featBtn').addEventListener('click',openPick);
$('#closePick').addEventListener('click',()=>{pick.hidden=true});
pick.addEventListener('click',e=>{if(e.target===pick){pick.hidden=true;return}const r=e.target.closest('[data-pick]');if(r)choose(r.dataset.pick)});
pickList.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.pick){e.preventDefault();choose(e.target.dataset.pick)}});

/* ---------- top 5 picker ---------- */
const ord=$('#order'),ordList=$('#ordList'),ordSlots=$('#ordSlots');
function renderOrder(){
  const {chosen}=storyList();state.order=chosen.map(a=>a.id);
  const feat=featuredAch();const earned=earnedInOrder().filter(a=>a!==feat);
  ordSlots.innerHTML=[0,1,2,3,4].map(i=>{const a=chosen[i];return `<div class="slot${a?' on':''}"><b>#${i+1}</b><span>${a?a.t:'Empty'}</span></div>`}).join('');
  const left=5-chosen.length;
  $('#ordNote').textContent=left?`Tap achievements in the order you want them. Empty slots get filled with your other unlocked ones.`:'All 5 slots filled. Tap a chosen one to remove it.';
  ordList.innerHTML=earned.length?earned.map(a=>{const i=chosen.indexOf(a),full=!left&&i<0;
    return `<div class="ach on${full?' dim':''}" role="button" tabindex="0" data-ord="${a.id}" aria-pressed="${i>=0}">
      <div class="ic">${iconSVG(a,false,false)}</div>
      <div style="min-width:0"><h3>${a.t}</h3><p>${a.d}</p></div>
      <div class="side">${i>=0?'<b class="ord">#'+(i+1)+'</b>':''}</div></div>`}).join('')
    :`<div class="empty">Unlock a few achievements first, then come back to order them.</div>`;
}
function tapOrder(id){
  const i=state.order.indexOf(id);
  if(i>=0)state.order.splice(i,1);else if(state.order.length<5)state.order.push(id);else return;
  update();renderOrder();
  const el=ordList.querySelector(`[data-ord="${id}"]`);if(el)el.focus();
}
function closeOrd(){ord.hidden=true;$('#ordBtn').focus()}
$('#ordBtn').addEventListener('click',()=>{renderOrder();ord.hidden=false;(ordList.querySelector('[data-ord]')||$('#doneOrd')).focus()});
$('#closeOrd').addEventListener('click',closeOrd);$('#doneOrd').addEventListener('click',closeOrd);
$('#clearOrd').addEventListener('click',()=>{state.order=[];update();renderOrder()});
ord.addEventListener('click',e=>{if(e.target===ord){closeOrd();return}const r=e.target.closest('[data-ord]');if(r)tapOrder(r.dataset.ord)});
ordList.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.ord){e.preventDefault();tapOrder(e.target.dataset.ord)}});

/* ---------- export ---------- */
$('#saveBtn').addEventListener('click',async()=>{
  await drawStory();
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  if(!blob)return;
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='digipen-achievements.png';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){pick.hidden=true;ord.hidden=true}});

function update(){persist();renderList();drawStory()}
renderList();drawStory();
document.fonts.ready.then(drawStory);
loadAssets();
</script>
